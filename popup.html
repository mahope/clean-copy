<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Copy</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --text: #e0e0e0;
      --accent: #4fc3f7;
      --green: #66bb6a;
      --muted: #888;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 320px;
      padding: 16px;
      font-size: 13px;
      line-height: 1.5;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 span { color: var(--accent); }
    .subtitle { color: var(--muted); font-size: 11px; margin-bottom: 16px; }
    .mode {
      background: var(--surface);
      border: 1px solid #333;
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .mode:hover { border-color: var(--accent); }
    .mode.active { border-color: var(--accent); background: #1a2744; }
    .mode-name { font-weight: 500; font-size: 14px; margin-bottom: 2px; }
    .mode-desc { color: var(--muted); font-size: 11px; }
    .mode .key { color: var(--accent); font-size: 10px; background: #0d1117; padding: 1px 6px; border-radius: 4px; }
    .actions { margin-top: 12px; }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: #333; color: var(--text); margin-top: 6px; }
    .btn-secondary:hover { opacity: 0.8; }
    .status {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
      min-height: 18px;
    }
    .status.success { color: var(--green); }
    .status.error { color: #ef5350; }
    .pro-badge {
      display: inline-block;
      font-size: 9px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 6px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .footer { margin-top: 16px; text-align: center; color: var(--muted); font-size: 10px; }
    .footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <h1><span>✦</span> Clean Copy</h1>
  <div class="subtitle">Copy web text as clean Markdown or plain text</div>

  <div class="mode" id="mode-plain">
    <div class="mode-name">Clean Text <span class="key">⌃⇧C</span></div>
    <div class="mode-desc">Remove styling, smart quotes, extra spaces</div>
  </div>

  <div class="mode" id="mode-markdown">
    <div class="mode-name">Markdown <span class="key">⌘⇧C</span></div>
    <div class="mode-desc">Convert selection to formatted Markdown</div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="copy-btn">Copy Selected Text</button>
    <button class="btn btn-secondary" id="settings-btn">⚙ Preferences</button>
  </div>

  <div class="status" id="status"></div>

  <div class="footer">
    <span>Free</span> · <a href="#" id="pro-link">Pro $19/yr <span class="pro-badge">Soon</span></a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
