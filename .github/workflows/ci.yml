name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run extension logic tests
        run: node tools/test_clean_copy.js
      - name: Manifest sanity (MV3 Chrome)
        run: |
          node -e "
            const m = require('./manifest.json');
            if (!m.version) throw new Error('no version');
            if (m.manifest_version !== 3) throw new Error('Chrome build must be MV3, got ' + m.manifest_version);
            console.log('✅ manifest ok:', m.name, m.version);
          "
